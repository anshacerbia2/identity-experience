name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      # The lockfile is the dependency set. An install that would change it fails, so a dependency
      # moves only through a reviewed change (STD-GLB-FE-003 supply chain).
      - name: install
        run: pnpm install --frozen-lockfile

      - name: format
        run: pnpm format:check

      - name: typecheck
        run: pnpm typecheck

      # ESLint, stylelint in every package, and the module boundaries of each application.
      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      # The build ends with scripts/check-dist.mjs: no inline script or style, no data: stylesheet
      # or font, and no credential-shaped string in the bundle.
      - name: build
        run: pnpm build

      - name: dependency audit
        run: pnpm audit --prod --audit-level high
