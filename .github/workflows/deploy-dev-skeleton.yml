name: deploy-dev skeleton

# STD-GLB-009 §Development Server Deployment: deploy/dev follows the application skeleton. Its own
# workflow rather than a job in another file: a reusable workflow that cannot be resolved fails the
# whole calling file, and the other jobs must not depend on it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-dev-skeleton:
    uses: anshacerbia2/scnehaux-architecture/.github/workflows/deploy-dev-skeleton.yml@main
    with:
      kind: application
